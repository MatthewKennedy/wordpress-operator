name: Docker Build and Push

on:
  push:
    branches:
    - main
    tags:
    - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read
  id-token: write

jobs:
  docker:
    runs-on: ubuntu-latest
    env:
      PUBLIC_REGISTRY: public.ecr.aws/w0a8g6c1

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Extract tag version
      if: startsWith(github.ref, 'refs/tags/')
      id: extract_tag
      run: echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v5
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: eu-west-2

    - name: Log in to Amazon Public ECR
      id: login-ecr-public
      uses: aws-actions/amazon-ecr-login@v2
      with:
        registry-type: public

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.17'

    - name: Install yq
      run: |
        sudo wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/local/bin/yq
        sudo chmod +x /usr/local/bin/yq
        mkdir -p bin
        cp /usr/local/bin/yq ./bin/yq

    - name: Build Manifests and Chart
      env:
        IMAGE_TAG: ${{ env.TAG || 'latest' }}
      run: |
        make build.all

    - name: Push Chart to Public ECR
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        CHART_PACKAGE=$(ls _output/charts/*.tgz | head -n 1)
        # Helm login for OCI public registry
        aws ecr-public get-login-password --region us-east-1 | helm registry login --username AWS --password-stdin public.ecr.aws
        helm push $CHART_PACKAGE oci://${{ env.PUBLIC_REGISTRY }}

    - name: Build and Push Docker Image
      if: startsWith(github.ref, 'refs/tags/')
      env:
        LOCAL_REGISTRY: "local-build"
        DOCKER_TAG: v${{ env.TAG }}
      run: |
        make build PLATFORMS=linux_amd64
        make -C images/wordpress-operator img.build BUILD_REGISTRY=${{ env.LOCAL_REGISTRY }}

        # Tag and push to the public registry
        docker tag ${{ env.LOCAL_REGISTRY }}/wordpress-operator-amd64:latest \
          ${{ env.PUBLIC_REGISTRY }}/wordpress-operator:${{ env.DOCKER_TAG }}

        docker push ${{ env.PUBLIC_REGISTRY }}/wordpress-operator:${{ env.DOCKER_TAG }}
